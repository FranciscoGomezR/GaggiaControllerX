<script type="text/markdown" id="md"># GATT Attribute Table — BLEspresso Controller

> **Source files:** `ble_espresso_app/components/BLE_Services/ble_cus.c/.h`
> **UUID registration + service creation:** `ble_cus_init()` in `ble_cus.c`
> **Data hub:** `volatile espresso_user_config_t g_Espresso_user_config_s` (see [modules.md](../architecture/modules/modules.md))

---

## Overview

The BLEspresso device exposes two custom GATT Primary Services. Both services share **one** 128-bit vendor-specific UUID base, registered once with the SoftDevice S132 in `ble_cus_init()` via a single `sd_ble_uuid_vs_add(CUSTOM_SERVICE_UUID_BASE, ...)` call. Both `sd_ble_gatts_service_add()` calls use the same `p_cus->uuid_type`.

| Property | Value |
|---|---|
| Device Name | `"BLEspresso"` (`DEVICE_NAME`, `bluetooth_drv.h`) |
| Manufacturer | `"PaxsElectronics"` (`MANUFACTURER_NAME`, `bluetooth_drv.h`) |
| UUID Base (both services) | `f364adc9-b000-xxxx-ba50-05ca45bf8abc` (`CUSTOM_SERVICE_UUID_BASE`) |
| ATT Handle Assignment | Dynamic — assigned by SoftDevice S132 during `ble_cus_init()` |
| Security | All attributes: `SEC_OPEN` (no pairing required) |
| Char add helper | `characteristic_add()` (nRF5 SDK `ble_srv_common`) |

> **Dead code:** `CUSTOM_PID_SERVICE_UUID_BASE` is defined in `ble_cus.h` but never used. The PID service is built on `CUSTOM_SERVICE_UUID_BASE`, same as the Brew service.

> **Handle notation:** Handles are dynamic. This table uses relative offsets from each service's Primary Service Declaration handle (`Sn+0`). Read actual values via GATT discovery.

---

## Data Format Reference

All characteristic values are **ASCII char arrays** (not raw binary floats), except
`0x1401` (2 B binary, see below). Conversions:
- `float_to_chr_array(value, buf, int_digits, dec_digits)` — float → ASCII (used at init)
- `chr_array_to_float(buf, int_digits, dec_digits)` — ASCII → float (on RX in `cus_evt_handler`)

| Format | Bytes | `float_to_chr_array` digits | Example | Range |
|---|---|---|---|---|
| `XXD` | 3 | `(2, 1)` | `"356"` → 35.6 | 0.0 – 99.9 |
| `XXXD` | 4 | `(3, 1)` | `"0985"` → 98.5 | 0.0 – 999.9 |
| `{mode, state}` | 2 | — | `01 05` → PROFILE, BREW_INFUSE | binary, see below |

> No decimal-point character is on the wire. Last digit is the first decimal place (×10 encoding).

### 0x1401 Machine Status Payload

2 B binary `[mode, state]`, READ + NOTIFY, notified **on change only**.
Source: `status_mode_t` / `status_state_t` (`espressoMachineServices.h`).
Diagram: [ble_0x1401_payload.drawio](ble_0x1401_payload.drawio) · HTML view: [gatt_table.html](gatt_table.html)

| Payload (hex) | Mode | State | Firmware condition |
|---|---|---|---|
| `00 00` | CLASSIC | HEATING_ON | `CLASSIC_IDLE`, temp − setpoint < −2.0 degC |
| `00 01` | CLASSIC | HEATING_OFF | `CLASSIC_IDLE`, temp − setpoint > +2.0 degC |
| `00 02` | CLASSIC | READY | `CLASSIC_IDLE`, temp within ±1.0 degC of setpoint |
| `00 03` | CLASSIC | BREWING | `CLASSIC_MODE_1` |
| `00 08` | CLASSIC | STEAMING | `CLASSIC_MODE_2` / `CLASSIC_MODE_3` |
| `01 00` | PROFILE | HEATING_ON | `PROFILE_IDLE`, temp − setpoint < −2.0 degC |
| `01 01` | PROFILE | HEATING_OFF | `PROFILE_IDLE`, temp − setpoint > +2.0 degC |
| `01 02` | PROFILE | READY | `PROFILE_IDLE`, temp within ±1.0 degC of setpoint |
| `01 04` | PROFILE | BREW_PREINFUSE | `RAMP_STEP` with `sNext = INFUSE` |
| `01 05` | PROFILE | BREW_INFUSE | `INFUSE`, or `RAMP_STEP` with `sNext = DECLINE` |
| `01 06` | PROFILE | BREW_TAPER | `DECLINE`, or `RAMP_STEP` with `sNext = STOP` |
| `01 07` | PROFILE | BREW_AUTOSTOP | `PROFILE_MODE_STOP` (profile ended, 120 s limit, or brew released) |
| `01 08` | PROFILE | STEAMING | `PROFILE_MODE_STEAM` / `PROFILE_MODE_STEAM_BREW` |
| `02 10` | STEP | STEP_OFF | `SF_IDLE` |
| `02 11` | STEP | STEP_ON | `SF_MODE_1` / `SF_MODE_2A` / `SF_MODE_2B` / `SF_MODE_MAX` |

**Hysteresis** (idle only, `e = boilerTempDegC − boilerTempSetpointDegC`):

| Condition | State | Define |
|---|---|---|
| `e < −2.0` | HEATING_ON | `STATUS_HEAT_ON_BAND_DEGC` |
| `e > +2.0` | HEATING_OFF | `STATUS_HEAT_OFF_BAND_DEGC` |
| `\|e\| ≤ 1.0` | READY | `STATUS_READY_BAND_DEGC` |
| `1.0 < \|e\| ≤ 2.0` | keep last state (dead band) | — |

- Unused codes: `0x09`–`0x0F`, `0x12`–`0xFF` → app shows "—".
- Boot GATT value `00 00`; replaced by the real state on the first service tick.
- `main.c` currently runs only `service_profile_mode()` → `00 xx` payloads are not reachable in the current build.

## BLE Write Flow (RX Path)

```
Mobile App writes char value
       ↓
SoftDevice S132 → BLE_GATTS_EVT_WRITE
       ↓
ble_cus.c: ble_cus_on_ble_evt() → on_write()
  - matches p_evt_write->handle to a known value_handle / cccd_handle
  - builds ble_cus_evt_t (data pointer + length), calls evt_handler
       ↓
bluetooth_drv.c: cus_evt_handler()  (SoftDevice IRQ context)
  - row = BLE_CFG_CHAR_arr[evt_type - BLE_CFG_EVT_FIRST]  (BLE_CFG_EVT_FIRST = BREW_TEMP RX evt)
  - parse_ble_ascii_float(): length == int_digits+1, all '0'..'9', min <= value <= max
  - valid   -> write g_Espresso_user_config_s.*, set pending bit (SHOT / CTRL),
               restart save debounce (g_ble_cfg_quiet_secs = 0)
  - invalid -> keep old value, restore it in the GATT table (restore_gatt_value())
       ↓
main.c: 1 s BLE task
  - pending && quiet >= BLE_CFG_SAVE_DEBOUNCE_SECS (2 s) && brew switch off
  - storage_save_user_config(): one sector erase + page write + read-back verify
  - reload load_new_pump_parameters() (SHOT) / temp_ctrl_set_pid_config() (CTRL)
```

## Debug Log Format (RTT / UART)

Config writes and NVM saves are logged with UUID + short name:
```
<info> app: BLE 0x1408 InfPwr = 100.00
<warning> app: BLE 0x1408 InfPwr rejected (len 2)
<info> app: NVM save [SHOT] -> STORED
<warning> app: NVM save [SHOT|CTRL] -> VERIFY_FAIL
```

| UUID | Log name | Field | NVM region |
|---|---|---|---|
| `0x1404` | BrewTemp | `brewTempDegC` | SHOT |
| `0x1405` | SteamTemp | `steamTempDegC` | SHOT |
| `0x1406` | PreInfPwr | `profPreInfusePwr` | SHOT |
| `0x1407` | PreInfTime | `profPreInfuseTmr` | SHOT |
| `0x1408` | InfPwr | `profInfusePwr` | SHOT |
| `0x1409` | InfTime | `profInfuseTmr` | SHOT |
| `0x140A` | TaperPwr | `profTaperingPwr` | SHOT |
| `0x140B` | TaperTime | `profTaperingTmr` | SHOT |
| `0x1501` | PID_P | `pidPTerm` | CTRL |
| `0x1502` | PID_I | `pidITerm` | CTRL |
| `0x1503` | PID_Imax | `pidImaxTerm` | CTRL |
| `0x1504` | PID_D | `pidDTerm` | CTRL |
| `0x1505` | PID_Pboost | `pidPboostTerm` | CTRL |
| `0x1506` | PID_Iboost | `pidIboostTerm` | CTRL |

NVM save status: `STORED` (written + verified), `VERIFY_FAIL` (read-back mismatch, retried
next second), `ERROR` (invalid value or corrupt NVM key). Names are compiled only when
`NRF_LOG_ENABLED == 1`.

## BLE Notification Flow (TX Path)

```
main.c: tf_ble_update flag (1000 ms period)
       ↓
bluetooth_drv.c: ble_notify_boiler_water_temp(waterTemp)
  - float → 4-char ASCII (XXXD)
  - ble_cus_notify_char() → sd_ble_gatts_hvx() on 0x1402 value handle
       ↓
SoftDevice S132 → ATT Notification PDU → Mobile App
```

```
espressoMachineServices.c: BREW/STEAM switch change (Classic + Profile)
  - apply_boiler_setpoint() → temp_ctrl_set_boiler_setpoint() (copy brew/steam temp,
    reset PID integral) + set setpoint-changed flag
       ↓
main.c loop: is_boiler_setpoint_changed() (read-and-clear)
       ↓
bluetooth_drv.c: ble_notify_boiler_setpoint(boilerTempSetpointDegC)
  - float → 4-char ASCII (XXXD) via float_to_chr_array()
  - sd_ble_gatts_value_set() on 0x1403 (READ stays current)
  - if connected: ble_cus_notify_char() → sd_ble_gatts_hvx() on 0x1403 value handle
```

```
espressoMachineServices.c: end of each service tick (Classic / Profile / Step)
  - map sRunning (+ hysteresis temp status when idle) → set_machine_status(mode, state)
  - flag set only when {mode, state} differs from last value
       ↓
main.c loop: is_machine_status_changed(arr) (read-and-clear), checked AFTER 0x1403
       ↓
bluetooth_drv.c: ble_notify_machine_status(arr)
  - sd_ble_gatts_value_set() on 0x1401 (READ stays current)
  - if connected: ble_cus_notify_char() → sd_ble_gatts_hvx() on 0x1401 value handle
```

## Notes

1. **Single UUID base** — `ble_cus_init()` registers `CUSTOM_SERVICE_UUID_BASE` once; both services use it. `CUSTOM_PID_SERVICE_UUID_BASE` is dead code.
2. **No Characteristic User Description (`0x2901`)** — not configured for any characteristic.
3. **Three CCCDs** — `0x1401` (Machine Status), `0x1402` (Boiler Temp) and `0x1403` (Boiler Setpoint, read-only) have Notify; all other characteristics are Read + Write.
4. **Write Without Response not used** — all writable characteristics use ATT Write Request + Response.
5. **Handle values are runtime-assigned** — discover at runtime, or read `ble_gatts_char_handles_t` members (`value_handle`, `cccd_handle`, `decl_handle`).
6. **Security** — all attributes `SEC_OPEN`; no bonding or encryption.
